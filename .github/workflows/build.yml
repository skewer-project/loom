name: CMake on multiple platforms

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          # Sanitize is Linux+clang only — fastest path for ASan/UBSan, and the
          # MSVC sanitizer story is its own work item.
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Sanitize
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libxext-dev libxfixes-dev libgl1-mesa-dev

      - name: Install Lavapipe (headless Vulkan ICD)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          # Lavapipe ships as part of mesa-vulkan-drivers. Point the loader at
          # the LLVMpipe ICD so GPU tests pick up the software rasteriser.
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          echo "LOOM_HEADLESS_GPU=1" >> "$GITHUB_ENV"

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Tools
          vulkan-use-cache: true

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2.17
        with:
          variant: sccache
          key: ${{ github.job }}-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          path: ${{ steps.strings.outputs.build-output-dir }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  clang-tidy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libxext-dev libxfixes-dev libgl1-mesa-dev

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Tools
          vulkan-use-cache: true

      - name: Configure CMake (export compile_commands.json)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -S .

      - name: Run clang-tidy on changed files
        run: |
          # Restrict to PR diff when running on a pull_request; otherwise scan
          # everything under src/ and include/. Diagnostics are surfaced but
          # WarningsAsErrors is empty in .clang-tidy so the build doesn't fail
          # on existing warnings — a follow-up PR tightens that.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- '*.cpp' '*.hpp' | grep -E '^(src|include)/' || true)
          else
            FILES=$(git ls-files 'src/*.cpp' 'src/*.hpp' 'include/*.hpp' || true)
          fi
          if [ -z "$FILES" ]; then
            echo "No C++ files to lint."
            exit 0
          fi
          echo "$FILES" | xargs -r clang-tidy -p build --quiet || true

  scan-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libxext-dev libxfixes-dev libgl1-mesa-dev

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Tools
          vulkan-use-cache: true

      - name: scan-build
        run: |
          scan-build -o scan-build-out cmake -B build -DCMAKE_BUILD_TYPE=Debug -S .
          scan-build -o scan-build-out --status-bugs cmake --build build || echo "scan-build flagged issues"

      - name: Upload scan-build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-build-report
          path: scan-build-out
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libxext-dev libxfixes-dev libgl1-mesa-dev mesa-vulkan-drivers vulkan-tools

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Tools
          vulkan-use-cache: true

      - name: Configure (Coverage)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Coverage -DCMAKE_CXX_COMPILER=g++ -S .

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          LOOM_HEADLESS_GPU: "1"
        run: ctest --output-on-failure

      - name: Generate coverage report
        run: gcovr --root . --filter 'include/' --filter 'src/' --xml-pretty -o coverage.xml --html-details coverage.html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage*.html
